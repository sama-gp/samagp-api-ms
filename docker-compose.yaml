services:
  db:
    image: postgres:13
    container_name: postgres_container
    environment:
      POSTGRES_USER: samagp
      POSTGRES_PASSWORD: samagp
      POSTGRES_DB: samagp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - samagp-network

  annonce-ms:
    build: .
    container_name: annonce-ms
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/samagp
      SPRING_DATASOURCE_USERNAME: samagp
      SPRING_DATASOURCE_PASSWORD: samagp
    networks:
      - samagp-network

volumes:
  postgres_data:

networks:
  samagp-network:
    driver: bridge

