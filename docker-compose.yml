services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    #image: quay.io/keycloak/keycloak:26.0.4
    container_name: keycloak
    environment:
      # Keycloak settings
      KC_HTTP_CORS_ALLOWED_ORIGINS: "*"
      KC_HTTP_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      KC_HTTP_CORS_ALLOWED_HEADERS: "*"
      KC_HTTP_CORS_EXPOSED_HEADERS: "*"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
        # Configuration du thème
#      KC_SPI_THEME_DEFAULT: samagp
#      KC_SPI_THEME_STATIC_MAX_AGE: -1
#      KC_SPI_THEME_CACHE_THEMES: false
#      KC_SPI_THEME_CACHE_TEMPLATES: false
    #      KC_HOSTNAME: localhost

    ports:
      - 8090:8080
    depends_on:
      - postgres
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/config/keycloak:/opt/keycloak/data/import
      - ./themes/mytheme/theme/samagp:/opt/keycloak/themes/samagp
      - ./themes/event/samagp-spi.jar:/opt/keycloak/providers/samagp-spi.jar
    command: start-dev --import-realm
    networks:
      - db-network
    restart: on-failure

  postgres:
    container_name: postgres
    image: postgres:16.8
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    volumes:
      - db-volume:/data/postgres
      - ./docker/config/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./logs:/var/log/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 30s
      retries: 3
    networks:
      - db-network
    restart: unless-stopped

  # Adminer - Interface Web pour PostgreSQL
  adminer:
    image: adminer:4.8.1
    container_name: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: ${POSTGRES_DB:-samagp}
      ADMINER_DESIGN: dracula  # Thème optionnel
    depends_on:
      - postgres
    networks:
      - db-network
    restart: unless-stopped

  api:
    container_name: samagp-api
    build: .
    environment:
      # Active le profil Docker
      SPRING_PROFILES_ACTIVE: docker

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/samagp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # Keycloak - URLs Docker
      KEYCLOAK_BASE_URL: http://keycloak:8080
      AUTH_SERVER_URL: http://keycloak:8080/auth
      REALM: samagp
      KEYCLOAK_USERNAME: admin
      KEYCLOAK_PASSWORD: admin
      GRANT_TYPE: password

      # Logging
      LOG_PATH: /var/log/myapp
      SPRING_APPLICATION_NAME: samagp

    ports:
      - "8082:8082"
    volumes:
      - ./logs:/var/log/myapp
    networks:
      - db-network
    depends_on:
      - postgres
      - keycloak
    restart: always

  samagp-angular:
    build:
      context: ../samagp
      dockerfile: Dockerfile
    container_name: samagp-angular
    ports:
      - "4200:80"
    environment:
      - API_BASE_URL="http://api:8082"
      - keycloakUrl="http://keycloak:8080/auth"
    networks:
      - db-network
    depends_on:
      - api
      - keycloak

