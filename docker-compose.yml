services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    #image: quay.io/keycloak/keycloak:26.0.4
    container_name: keycloak
    environment:
      # Keycloak settings
      KC_HTTP_CORS_ALLOWED_ORIGINS: "http://localhost:4200, http://localhost:8082, http://localhost:8090"
      KC_HTTP_CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      KC_HTTP_CORS_ALLOWED_HEADERS: "*"
      KC_HTTP_CORS_EXPOSED_HEADERS: "*"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KC_DB}
      KC_DB_URL_HOST: ${KC_DB_URL_HOST}
      KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    #      KC_HOSTNAME: localhost

    ports:
      - 8090:8080
    depends_on:
      - postgres
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/config/keycloak:/opt/keycloak/data/import
      - ./themes/event:/opt/keycloak/providers/
      - ./themes/theme/samagp:/opt/keycloak/themes/samagp
    command: start-dev --import-realm
    networks:
      - db-network
    restart: on-failure

  postgres:
    container_name: postgres
    image: postgres:16.8
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    volumes:
      - db-volume:/data/postgres
      - ./docker/config/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./logs:/var/log/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 30s
      retries: 3
    networks:
      - db-network
    restart: unless-stopped

  api:
    container_name: samagp-api
    build: .
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      LOG_PATH: ${LOG_PATH}
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME}
      REALM: ${REALM}
      AUTH_SERVER_URL: ${AUTH_SERVER_URL}
      KEYCLOAK_USERNAME: ${KEYCLOAK_USERNAME}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD}
      GRANT_TYPE: ${GRANT_TYPE}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_EXTERNAL_URL: ${KEYCLOAK_EXTERNAL_URL}
    ports:
      - "8082:8082"
    volumes:
      - ./logs:/var/log/myapp
    networks:
      - db-network
    depends_on:
      - postgres
      - keycloak
    restart: always

  samagp-angular:
    build:
      context: ../test/samagp-angular
      dockerfile: Dockerfile
    container_name: samagp-angular
    ports:
      - "4200:80"
    environment:
      - API_BASE_URL="http://samagp-api:8082"
      - keycloakUrl="http://keycloak:8080/auth"
    networks:
      - db-network
    depends_on:
      - api
      - keycloak

networks:
  db-network:
    driver: bridge

volumes:
  db-volume:
  keycloak-data:
