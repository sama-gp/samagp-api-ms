version: "3.9"

services:
  postgres:
    container_name: postgres
    image: postgres:16.8
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samagp
      PGDATA: /data/postgres
    volumes:
      - db-volume:/data/postgres
      - ./config/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./config/init/init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
      - ../logs:/var/log/postgresql
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 30s
      retries: 3
    networks:
      - db-network
    restart: unless-stopped

networks:
  db-network:
    driver: bridge

volumes:
  db-volume:
