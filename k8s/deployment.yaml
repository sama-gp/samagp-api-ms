apiVersion: apps/v1
kind: Deployment
metadata:
  name: samagp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: samagp
  template:
    metadata:
      labels:
        app: samagp
    spec:
      containers:
        - name: myapp
          image: souleygassama/sama-gp-annonce-image # Remplacez par votre image Docker
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/samagp"
            - name: SPRING_DATASOURCE_USERNAME
              value: "samagp"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
